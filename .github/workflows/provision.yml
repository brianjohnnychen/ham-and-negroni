name: provision
# One-time (re-runnable) backend setup: free Supabase org + project, schema, auth settings, repo secrets,
# site/config.js, public repo, GitHub Pages. Then deploys the site and runs the e2e check.
# Trigger: change ops/provision.request (any content) or run manually.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['ops/provision.request']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency: { group: provision, cancel-in-progress: false }

jobs:
  provision:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      GH_PAT: ${{ secrets.GH_PAT }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets are present
        run: |
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "SUPABASE_ACCESS_TOKEN secret missing"; exit 1; }
          [ -n "$GH_PAT" ] || { echo "GH_PAT secret missing"; exit 1; }
      - name: Provision Supabase, Pages and secrets
        run: python3 ops/provision.py
      - name: Commit the results
        if: always()
        run: |
          ops/commit_back.sh "ops: provision result [skip ci]" ops/provision.log ops/infra.json site/config.js

  bots:
    needs: provision
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      FOUNDERS_NOTES: ${{ secrets.FOUNDERS_NOTES }}
      GH_PAT: ${{ secrets.GH_PAT }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Set up the AI members
        run: python3 ops/bots.py
      - name: Commit the results
        if: always()
        run: |
          ops/commit_back.sh "ops: AI members result [skip ci]" ops/bots.log ops/bots.json

  deploy:
    needs: bots
    uses: ./.github/workflows/pages.yml

  e2e:
    needs: deploy
    uses: ./.github/workflows/e2e.yml
    secrets: inherit
