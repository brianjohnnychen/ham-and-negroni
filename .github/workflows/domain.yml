name: domain
# Points GitHub Pages at the custom domain in site/CNAME, waits for the HTTPS certificate, enforces HTTPS and verifies.
# DNS is at Cloudflare (four A records + www CNAME, DNS only). Result: ops/domain/result.json (committed back).
# Trigger: touch ops/domain.request, change site/CNAME, or run manually.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['ops/domain.request', 'site/CNAME']

permissions:
  contents: write

concurrency: { group: domain, cancel-in-progress: false }

jobs:
  domain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_PAT: ${{ secrets.GH_PAT }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Check secrets are present
        run: |
          [ -n "$GH_PAT" ] || { echo "GH_PAT secret missing"; exit 1; }
      - name: Set the domain, wait for HTTPS, verify
        run: python3 ops/domain.py
      - name: Commit the result
        if: always()
        run: |
          ops/commit_back.sh "ops: domain result [skip ci]" ops/domain
